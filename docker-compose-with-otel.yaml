services:
  loki:
    image: grafana/loki:latest
    profiles:
      - otel

    ports:
      - "3100:3100"
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
        - ./loki-data:/loki  

  tempo:
    image: grafana/tempo:latest
    profiles:
      - otel
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./otel-shared/tempo.yaml:/etc/tempo.yaml
      - ./tempo-data:/tmp/tempo
    ports:
      - "14268:14268" # jaeger ingest
      - "3200:3200" # tempo
      - "9095:9095" # tempo grpc
      # - "4317:4317" # otlp grpc
      # - "4318:4318" # otlp http
      - "9411:9411" # zipkin

  prometheus:
    image: prom/prometheus:latest
    profiles:
      - otel

    command:
      - --config.file=/etc/prometheus.yaml
      - --web.enable-remote-write-receiver
      - --enable-feature=exemplar-storage
    volumes:
      - ./otel-shared/prometheus.yaml:/etc/prometheus.yaml
      # - ./otel-shared/rules.yml:/etc/rules.yml
      - ./prometheus-data:/prometheus   # 持久化数据
    ports:
      - "9090:9090"

  alertmanager:
    image: prom/alertmanager
    profiles:
      - otel

    container_name: alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./otel-shared/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"

  grafana:
    image: grafana/grafana:10.0.3
    profiles:
      - otel

    depends_on:
      - loki
      - tempo
      - prometheus
    volumes:
      - ./otel-shared/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=false
      - GF_FEATURE_TOGGLES_ENABLE=traceqlEditor
    ports:
      - "3001:3000"

  # OpenTelemetry collector. Make sure you set USERID and GOOGLE_APPLICATION_CREDENTIALS
  # environment variables for your container to authenticate correctly
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.81.0
    profiles:
      - otel

    ports:
      - "9100:9100"
      - "4317:4317"   # <- 添加 OTLP gRPC
      - "4318:4318"   # <- 添加 OTLP HTTP
    depends_on:
      - tempo
      - loki
    volumes:
      - ./otel-shared/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml

  keep-frontend-dev:
    extends:
      file: docker-compose.common.yml
      service: keep-frontend-common
    environment:
      - API_URL=http://keep-backend-dev:8080
    build:
      dockerfile: docker/Dockerfile.dev.ui
    volumes:
      - ./keep-ui:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - keep-backend-dev

  keep-backend-dev:
    extends:
      file: docker-compose.common.yml
      service: keep-backend-common
    build:
      dockerfile: docker/Dockerfile.dev.api
    environment:
      - OTEL_SERVICE_NAME=keephq
      - OTLP_ENDPOINT=http://otel-collector:4317
      - METRIC_OTEL_ENABLED=true
    volumes:
      - .:/app
      - ./state:/state

  keep-websocket-server:
    extends:
      file: docker-compose.common.yml
      service: keep-websocket-server-common

  # 异常检测后台服务 - 自动检测 Prometheus 指标异常
  keep-anomaly-detector:
    build:
      dockerfile: docker/Dockerfile.dev.api
    # 不继承 keep-backend-common，避免端口冲突
    # 只继承环境变量配置
    environment:
      - PORT=8080
      - SECRET_MANAGER_TYPE=FILE
      - SECRET_MANAGER_DIRECTORY=/state
      - DATABASE_CONNECTION_STRING=sqlite:////state/db.sqlite3?check_same_thread=False
      - OPENAI_API_KEY=$OPENAI_API_KEY
      - PUSHER_APP_ID=1
      - PUSHER_APP_KEY=keepappkey
      - PUSHER_APP_SECRET=keepappsecret
      - PUSHER_HOST=keep-websocket-server
      - PUSHER_PORT=6001
      - USE_NGROK=false
      # Keep API 配置
      - KEEP_API_URL=http://keep-backend-dev:8080
      - KEEP_API_KEY=a71985bb-518b-40cf-8100-1686fae889e8
      # Prometheus 配置（使用同一个网络中的 Prometheus）
      - PROMETHEUS_URL=http://prometheus:9090
      # 异常检测配置
      - ANOMALY_DETECTOR_ENABLED=true
      - ANOMALY_DETECTOR_TRACES_ENABLED=true
      - ANOMALY_DETECTOR_LOGS_ENABLED=true
      - TEMPO_URL=http://tempo:3200
      - LOKI_URL=http://loki:3100
      - ANOMALY_DETECTOR_INTERVAL=15
      - ANOMALY_DETECTOR_MIN_DATA_POINTS=80       # 更多点建立稳定基线，减少重启噪声
      - ANOMALY_DETECTOR_ALGORITHM=zscore
      - ANOMALY_DETECTOR_CONTAMINATION=0.005
      - ANOMALY_DETECTOR_ZSCORE_THRESHOLD=2.5
      - ANOMALY_DETECTOR_QUERY_STEP=15s
      - ANOMALY_DETECTOR_QUERY_RANGE=3600          # 查询最近1小时的数据
      - ANOMALY_DETECTOR_RATE_CHANGE_THRESHOLD=0.1   # 环比阈值 +10%，更敏感，能检测到故障注入
      # 显式包含高 CPU / 请求时延相关指标，避免自动发现被截断
      # 仅监控故障注入相关的少量指标（请求量/耗时、ad CPU）
      - ANOMALY_DETECTOR_INCLUDE_METRICS=keep_http_client_duration_count,keep_http_server_request_duration_count,keep_jvm_cpu_recent_utilization,keep_process_cpu_seconds_total,keep_process_cpu_time
      # 收紧排除规则，避免系统/导出器噪声
      - ANOMALY_DETECTOR_EXCLUDE_METRICS=^go_.*,^cpython_.*,^promhttp_.*
      - ANOMALY_DETECTOR_FALLBACK_METRICS=
    command: ["python", "-m", "keep.server_jobs_bg"]
    volumes:
      - .:/app
      - ./state:/state
    depends_on:
      - keep-backend-dev
      - prometheus
    profiles:
      - otel

  log_collector:
    image: timberio/vector:0.32.2-debian
    profiles:
      - otel
    volumes:
      - ./otel-shared/vector.toml:/etc/vector/vector.toml
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  certs:
    driver: local
  esdata01:
    driver: local
  kibanadata:
    driver: local

  db_data:
